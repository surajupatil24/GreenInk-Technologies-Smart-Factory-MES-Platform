name: greenink-smartfactory
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greenink}
      POSTGRES_USER: ${POSTGRES_USER:-greenink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: infrastructure/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=db;Port=5432;Database=${POSTGRES_DB:-greenink};Username=${POSTGRES_USER:-greenink};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:?Set BOOTSTRAP_EMAIL}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
      Bootstrap__DisplayName: ${BOOTSTRAP_DISPLAY_NAME:?Set BOOTSTRAP_DISPLAY_NAME}
    volumes:
      - api_keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: infrastructure/web.Dockerfile
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres_data:
  api_keys:
